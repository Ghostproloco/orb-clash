function dash(a,b){let an=Math.atan2(b.y-a.y,b.x-a.x);a.vx=Math.cos(an)*430;a.vy=Math.sin(an)*430;a.dashing=.65;effect('slash',a.x,a.y,O[a.id].c,{ex:b.x,ey:b.y,life:.36})}
function skill(a,b,s,ult=false){if(a.hp<=0||b.hp<=0)return;let c=O[a.id].c,d=s.damage; say(a,s);if(!ult)a.ult=clamp(a.ult+7,0,100);else{a.ult=0;flash=.28;shake=12;effect('banner',W/2,67,c,{txt:O[a.id].name.toUpperCase()+' · '+s.name.toUpperCase(),life:1.5});audio(75,.09,.4)}
switch(s.type){case'laser':case'lightning':beam(a,b,c,s.type==='lightning'?'lightning':'beam');damage(b,d,a);break;
case'bolt':case'fire':case'ice':case'poison':projectile(a,b,s);break;
case'summon':[-.65,0,.65].forEach(v=>projectile(a,b,s,v));break;

case'wave':effect('ring',a.x,a.y,c,{r:Math.max(180,dist(a,b)),life:.65});damage(b,d,a);break;
case'freeze':b.slow=2.2;damage(b,d,a);effect('ice',b.x,b.y,c,{r:60,life:1});break;

case'storm':for(let i=0;i<3;i++)zone(a,b,{damage:d},'strike',75,1.2+i*.3,clamp(b.x+rand(-75,75),50,W-50),clamp(b.y+rand(-75,75),50,H-50));break;
case'chess':effect('chess',0,0,c,{life:1.5});beam({x:25,y:25},{x:W-25,y:H-25},'#ff496e');beam({x:W-25,y:25},{x:25,y:H-25},'#ff496e');damage(b,d*.68,a);zone(a,b,{damage:d*.32},'strike',120,1.2);break;
case'holy':for(let i=0;i<4;i++)zone(a,b,{damage:d/4},'strike',95,.65+i*.25,clamp(b.x+rand(-50,50),50,W-50),clamp(b.y+rand(-50,50),50,H-50));effect('holy',b.x,b.y,c,{r:180,life:1.3});break;

case'blackhole':effect('vortex',b.x,b.y,c,{r:220,life:2});b.gravity=3.4;damage(b,d*.7,a);zone(a,b,{damage:d*.3},'strike',135,1.2);break;

function step(dt){time+=dt;for(let a of balls){let b=balls[1-a.k];a.rot+=dt*2;a.prev.push({x:a.x,y:a.y});if(a.prev.length>90)a.prev.shift();a.trail.push({x:a.x,y:a.y});if(a.trail.length>20)a.trail.shift();for(let k of ['slow','phase','burn','gravity','hit','dashing'])a[k]=Math.max(0,(a[k]||0)-dt);if(a.dot>0){a.dot-=dt;damage(a,a.dotRate*dt,b,true)}if(a.gravity>0){let d=dist(a,b)||1;a.vx+=(b.x-a.x)/d*190*dt;a.vy+=(b.y-a.y)/d*190*dt}let mag=Math.hypot(a.vx,a.vy)||1,target=a.dashing?420:O[a.id].speed;let f=1-Math.exp(-dt*4);a.vx*=1+(target/mag-1)*f;a.vy*=1+(target/mag-1)*f;let m=a.slow>0?.35:1;a.x+=a.vx*dt*m;a.y+=a.vy*dt*m;let margin=44;if(a.x<margin||a.x>W-margin){a.x=clamp(a.x,margin,W-margin);a.vx=a.x===margin?Math.abs(a.vx):-Math.abs(a.vx);a.vy+=rand(-25,25);effect('spark',a.x,a.y,O[a.id].c,{vx:-a.vx*.35,vy:rand(-40,40),size:3})}if(a.y<margin||a.y>H-margin){a.y=clamp(a.y,margin,H-margin);a.vy=a.y===margin?Math.abs(a.vy):-Math.abs(a.vy);a.vx+=rand(-25,25)}a.ult=clamp(a.ult+dt*1.8,0,100);for(let j=0;j<3;j++){a.cd[j]-=dt;if(a.cd[j]<=0&&b.hp>0){skill(a,b,O[a.id].skills[j]);a.cd[j]=O[a.id].skills[j].cd*rand(.91,1.12)}}if(a.ult>=100&&b.hp>0)skill(a,b,O[a.id].skills[3],true);if(a.burn>0&&dist(a,b)<95)damage(b,dt*4,a,true)}
let [a,b]=balls,d=dist(a,b)||.01;if(d<2*R){let nx=(b.x-a.x)/d,ny=(b.y-a.y)/d,over=(2*R-d)/2;a.x-=nx*over;a.y-=ny*over;b.x+=nx*over;b.y+=ny*over;let rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rel>0){a.vx-=rel*nx;a.vy-=rel*ny;b.vx+=rel*nx;b.vy+=rel*ny;if(!a.collision||time-a.collision>.35){let ad=a.dashing&&a.dashDamage?a.dashDamage:3,bd=b.dashing&&b.dashDamage?b.dashDamage:3;damage(b,ad,a);damage(a,bd,b);a.dashing=b.dashing=0;a.collision=b.collision=time;burst((a.x+b.x)/2,(a.y+b.y)/2,'#ffffff',18,55)}}}
for(let p of shots){p.age+=dt;let target=balls[p.target],owner=balls[p.owner];let dx=target.x-p.x,dy=target.y-p.y,l=Math.hypot(dx,dy)||1,turn=p.type==='summon'?4:1.6;p.vx+=(dx/l*320-p.vx)*dt*turn;p.vy+=(dy/l*320-p.vy)*dt*turn;p.x+=p.vx*dt;p.y+=p.vy*dt;if(l<R+p.r){damage(target,p.d,owner);if(p.type==='fire'||p.type==='poison'){target.dot=3;target.dotRate=p.type==='fire'?1.5:2}if(p.type==='ice')target.slow=1.5;p.age=p.life;burst(p.x,p.y,p.c,12,50)}}shots=shots.filter(p=>p.age<p.life&&p.x>-100&&p.x<W+100&&p.y>-100&&p.y<H+100);
for(let z of zones){z.age+=dt;let b=balls[z.target],a=balls[z.owner],inside=Math.hypot(b.x-z.x,b.y-z.y)<z.r+R;if(z.type==='mine'&&z.age>.4&&inside){damage(b,z.d,a);burst(z.x,z.y,z.c,25,100);z.age=z.life}else if(z.type==='strike'&&z.age>=z.life){effect('pillar',z.x,z.y,z.c,{r:z.r,life:.6});if(inside)damage(b,z.d,a)}else if(z.type==='cloud'){z.tick-=dt;if(z.tick<=0){if(inside)damage(b,z.d,a);z.tick=1}}}zones=zones.filter(z=>z.age<z.life);for(let e of fx)e.age+=dt;fx=fx.filter(e=>e.age<e.life);shake*=Math.exp(-dt*9);flash=Math.max(0,flash-dt);if(time>70){for(let b of balls)damage(b,dt*3,null,true)}if(balls.some(b=>b.hp<=.001)||time>=105)end();}
function end(){state='ended';$('fight').disabled=false;$('pause').disabled=true;let [a,b]=balls;let win=Math.abs(a.hp-b.hp)<.01?null:a.hp>b.hp?a:b;let title=win?O[win.id].name.toUpperCase()+' GANA':'EMPATE';$('winner').textContent=title;$('summary').textContent=Math.floor(time)+' s de combate · '+Math.ceil(a.hp)+' / '+Math.ceil(b.hp)+' PV';$('result').hidden=false;$('log').textContent=title;history.unshift({a:O[a.id].name,b:O[b.id].name,w:win?O[win.id].name:'Empate',s:Math.floor(time)});history=history.slice(0,6);try{localStorage.setItem('orbclash_history',JSON.stringify(history))}catch{}renderHistory();renderCards();audio(620,.06,.3)}
function renderHistory(){$('history').innerHTML='<b>Últimos combates</b>'+ (history.length?history.map(h=>`<div>${h.a} vs ${h.b} · <b>${h.w}</b> · ${h.s}s</div>`).join(''):'<div>Sin resultados todavía.</div>')}
const bg=document.createElement('canvas');bg.width=W;bg.height=H;let q=bg.getContext('2d');let gr=q.createRadialGradient(W/2,H*.42,25,W/2,H/2,530);gr.addColorStop(0,'#283251');gr.addColorStop(.48,'#12172e');gr.addColorStop(1,'#080919');q.fillStyle=gr;q.fillRect(0,0,W,H);for(let i=0;i<200;i++){circle(q,rand(0,W),rand(0,H),rand(.3,1.5),`rgba(193,190,255,${rand(.1,.55)})`)}q.save();q.translate(W/2,H/2);for(let r of [85,155,236,290]){circle(q,0,0,r,null,'#a47bff22',1.8);circle(q,0,0,r+6,null,'#b79bff13',1)}for(let i=0;i<24;i++){q.rotate(TAU/24);line(q,[[0,-234],[0,-245]],'#a990ff55',2);line(q,[[0,-281],[0,-292]],'#ffd89955',2)}for(let i=0;i<8;i++){q.rotate(TAU/8);line(q,[[0,-140],[0,-75],[18,-57],[0,-20],[-18,-57],[0,-75]],'#ab8bff22',1)}q.restore();q.strokeStyle='#7764a0';q.lineWidth=2;q.strokeRect(15,15,W-30,H-30);q.strokeStyle='#b79aef44';q.strokeRect(24,24,W-48,H-48);for(let x of [24,W-24])for(let y of [24,H-24]){q.save();q.translate(x,y);q.rotate(Math.PI/4);q.fillStyle='#e0bc80';q.shadowColor='#e6a9ff';q.shadowBlur=17;q.fillRect(-7,-7,14,14);q.restore()}
function drawFx(e){let p=e.age/e.life,al=1-p,g=ctx;g.save();g.globalAlpha=al;g.shadowColor=e.c;g.shadowBlur=12;g.lineCap='round';let r=e.r||70;switch(e.type){case'spark':circle(g,e.x+(e.vx||0)*e.age,e.y+(e.vy||0)*e.age,(e.size||2)*Math.max(.2,al),e.c);break;case'ring':case'shield':circle(g,e.x,e.y,12+r*p,null,e.c,Math.max(1,6*al));circle(g,e.x,e.y,8+r*p*.8,null,'#ffffff',1);break;case'beam':case'slash':line(g,[[e.x,e.y],[e.ex,e.ey]],e.c,13*al+1);line(g,[[e.x,e.y],[e.ex,e.ey]],'#fff',3*al+1);break;case'lightning':{let pts=[[e.x,e.y]],dx=e.ex-e.x,dy=e.ey-e.y;for(let j=1;j<13;j++){let off=Math.sin(j*8.3+e.seed*19)*23;pts.push([e.x+dx*j/13-dy/(Math.hypot(dx,dy)||1)*off,e.y+dy*j/13+dx/(Math.hypot(dx,dy)||1)*off])}pts.push([e.ex,e.ey]);line(g,pts,e.c,12*al+1);line(g,pts,'#fff',3);break}case'text':g.font='900 24px system-ui';g.textAlign='center';g.lineWidth=4;g.strokeStyle='#090719';g.strokeText(e.txt,e.x,e.y-p*45);g.fillStyle=e.c;g.fillText(e.txt,e.x,e.y-p*45);break;case'banner':g.globalAlpha=Math.min(1,al*3);g.fillStyle='#090a19dd';g.fillRect(55,e.y-24,W-110,44);g.font='900 23px system-ui';g.textAlign='center';g.fillStyle=e.c;g.fillText(e.txt,e.x,e.y+5);break;case'pillar':{let grd=g.createLinearGradient(e.x-r,0,e.x+r,0);grd.addColorStop(0,e.c+'00');grd.addColorStop(.5,'#fff');grd.addColorStop(1,e.c+'00');g.fillStyle=grd;g.fillRect(e.x-r*.65,0,r*1.3,e.y);circle(g,e.x,e.y,r*p,null,e.c,5);break}case'chess':g.shadowBlur=0;g.globalAlpha=al*.22;for(let x=0;x<W;x+=65)for(let y=0;y<H;y+=65){g.fillStyle=(x/65+y/65)%2===0?'#a1dcff':'#000';g.fillRect(x,y,65,65)}break;case'vortex':g.translate(e.x,e.y);g.rotate(p*8);for(let j=0;j<6;j++){g.rotate(TAU/6);g.beginPath();for(let k=0;k<25;k++){let a=k/25*3.8,rr=r*k/25*(.4+p*.6),x=Math.cos(a)*rr,y=Math.sin(a)*rr;k?g.lineTo(x,y):g.moveTo(x,y)}g.strokeStyle=e.c;g.lineWidth=6*al;g.stroke()}circle(g,0,0,r*.26,'#070514',e.c,4);break;case'ice':case'quake':case'holy':case'clock':case'nova':{let rr=r*(.24+p*.76);circle(g,e.x,e.y,rr,null,e.c,8*al+1);circle(g,e.x,e.y,rr*.8,null,'#fff',2*al);for(let j=0;j<16;j++){let a=j*TAU/16+p*.4,x=e.x+Math.cos(a)*rr,y=e.y+Math.sin(a)*rr;line(g,[[e.x+Math.cos(a)*rr*.56,e.y+Math.sin(a)*rr*.56],[x,y],[x+Math.cos(a+.7)*22,y+Math.sin(a+.7)*22]],e.c,4*al+1)}if(e.type==='clock'){line(g,[[e.x,e.y-rr*.7],[e.x,e.y],[e.x+rr*.5,e.y+rr*.2]],'#fff',4)}break}}
g.restore()}
function draw(){let g=ctx;g.clearRect(0,0,W,H);g.save();if(shake>0)g.translate(rand(-shake,shake),rand(-shake,shake));g.drawImage(bg,0,0);for(let z of zones){let p=z.age/z.life;g.save();g.globalAlpha=.28;circle(g,z.x,z.y,z.r,z.c);g.globalAlpha=.85;circle(g,z.x,z.y,z.r,null,z.c,2);circle(g,z.x,z.y,z.r*(z.type==='strike'?p:.8),null,z.c,3);g.restore()}for(let p of shots){g.save();g.shadowColor=p.c;g.shadowBlur=16;line(g,[[p.x-p.vx*.065,p.y-p.vy*.065],[p.x,p.y]],p.c,7);circle(g,p.x,p.y,p.r,p.c,'#fff',1);g.restore()}for(let a of balls){let c=O[a.id].c;for(let i=0;i<a.trail.length;i++){let p=a.trail[i];g.globalAlpha=i/a.trail.length*.18;circle(g,p.x,p.y,8+i*.7,c)}g.globalAlpha=1;if(a.hp>0){g.save();if(a.phase>0)g.globalAlpha=.55;orb(g,a.id,a.x,a.y,R,time,a.rot);g.restore();if(a.shield>0){circle(g,a.x,a.y,44,null,'#b9efff',2);circle(g,a.x,a.y,48,null,'#b9efff55',1)}if(a.burn>0)circle(g,a.x,a.y,65,null,c+'88',3);if(a.slow>0)circle(g,a.x,a.y,37,null,'#c3eaff',3);if(a.hit>0)circle(g,a.x,a.y,R,'#ffffff44');g.font='900 18px system-ui';g.textAlign='center';g.lineWidth=4;g.strokeStyle='#0a0a17';g.strokeText(Math.ceil(a.hp),a.x,a.y+6);g.fillStyle='#fff';g.fillText(Math.ceil(a.hp),a.x,a.y+6);g.font='800 11px system-ui';g.strokeText(O[a.id].name.toUpperCase(),a.x,a.y+57);g.fillStyle=c;g.fillText(O[a.id].name.toUpperCase(),a.x,a.y+57)}}for(let e of fx)drawFx(e);if(flash>0){g.fillStyle=`rgba(255,235,255,${flash*.35})`;g.fillRect(0,0,W,H)}g.restore();if(state==='ready'||state==='paused'){g.fillStyle='#070a1a99';g.fillRect(W/2-85,H/2-25,170,50);g.strokeStyle='#a68ac8';g.strokeRect(W/2-85,H/2-25,170,50);g.fillStyle='#ffe3a3';g.font='900 25px system-ui';g.textAlign='center';g.fillText(state==='ready'?'VS':'PAUSA',W/2,H/2+9)}}
function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(state==='running'){acc+=dt*speed;while(acc>=1/120&&state==='running'){step(1/120);acc-=1/120}hud()}draw();requestAnimationFrame(frame)}
